<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#7C3AED"
  >

  <title>
    Broadcaster Dashboard • Kamwenge Live™
  </title>


  <!-- PWA -->
  <link
    rel="manifest"
    href="manifest.webmanifest"
  >


  <!-- ICONS -->
  <link
    rel="icon"
    href="assets/icons/icon.svg"
    type="image/svg+xml"
  >

  <link
    rel="apple-touch-icon"
    href="assets/icons/apple-touch-icon.png"
  >


  <!-- MAIN CSS -->
  <link
    rel="stylesheet"
    href="css/style.css"
  >


  <!-- =====================================================
       DASHBOARD MOBILE / RESPONSIVE FIXES
  ====================================================== -->

  <style>

    /* =====================================================
       PAGE
    ====================================================== */

    body {
      overflow-x: hidden;
    }


    .dashboard-main {
      padding-bottom: 60px;
    }


    /* =====================================================
       DASHBOARD HEADER
    ====================================================== */

    .dash-head {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 24px;

      flex-wrap: wrap;

      margin-top: 26px;
    }


    .host-row {

      display: flex;

      align-items: center;

      gap: 16px;

      min-width: 0;
    }


    .host-row > div {

      min-width: 0;
    }


    #dash-name {

      margin:

        4px

        0

        0;

      line-height: 1.08;

      overflow-wrap: anywhere;
    }


    .dashboard-actions {

      display: flex;

      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }


    /* =====================================================
       STATS
    ====================================================== */

    .stats {

      display: grid;

      grid-template-columns:

        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 16px;

      margin:

        28px

        0;
    }


    .stat {

      min-width: 0;
    }


    /* =====================================================
       BROADCAST AREA
    ====================================================== */

    .broadcast-section {

      margin-top: 24px;
    }


    .broadcast-section .section-title {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;

      flex-wrap: wrap;
    }


    /* =====================================================
       DESKTOP TABLE
    ====================================================== */

    .table-wrap {

      width: 100%;

      max-width: 100%;

      overflow-x: auto;

      margin-top: 20px;

      -webkit-overflow-scrolling: touch;
    }


    .table {

      width: 100%;

      border-collapse: collapse;

      table-layout: auto;
    }


    .table th,
    .table td {

      vertical-align: middle;

      text-align: left;
    }


    .table td:first-child {

      min-width: 240px;

      overflow-wrap: anywhere;
    }


    .table td:last-child {

      min-width: 230px;
    }


    /*
      Buttons generated by dashboard.js will wrap
      instead of overflowing beyond the screen.
    */

    #events-body td:last-child {

      white-space: normal !important;
    }


    #events-body td:last-child .btn,
    #events-body td:last-child a,
    #events-body td:last-child button {

      margin:

        4px

        5px

        4px

        0;
    }


    /* =====================================================
       TABLE STATUS
    ====================================================== */

    #events-body td:nth-child(2) {

      font-weight: 700;
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 760px) {


      /* ---------------------------------------------
         PAGE
      --------------------------------------------- */

      .container {

        width: 100%;

        max-width: 100%;

        padding-left: 14px;

        padding-right: 14px;
      }


      .top-strip {

        padding:

          12px

          14px;

        text-align: center;

        font-size: 14px;

        font-weight: 700;
      }


      /* ---------------------------------------------
         USER HEADER
      --------------------------------------------- */

      .dash-head {

        display: block;

        margin-top: 22px;
      }


      .host-row {

        align-items: center;

        margin-bottom: 22px;
      }


      .big-avatar {

        width: 72px !important;

        height: 72px !important;

        flex: 0 0 72px;
      }


      #dash-name {

        font-size:

          clamp(
            30px,
            9vw,
            46px
          );

        line-height: 1.05;
      }


      .dashboard-actions {

        display: grid;

        grid-template-columns:

          repeat(
            2,
            minmax(0, 1fr)
          );

        gap: 10px;
      }


      .dashboard-actions .btn {

        width: 100%;

        display: flex;

        align-items: center;

        justify-content: center;

        text-align: center;

        min-height: 48px;

        white-space: normal;
      }


      .dashboard-actions #logout {

        grid-column: 1 / -1;
      }


      /* ---------------------------------------------
         STATS
      --------------------------------------------- */

      .stats {

        grid-template-columns: 1fr;

        gap: 14px;

        margin-top: 28px;

        margin-bottom: 28px;
      }


      .stat {

        padding: 24px;
      }


      /* ---------------------------------------------
         BROADCAST SECTION HEADER
      --------------------------------------------- */

      .broadcast-section {

        padding:

          18px

          14px !important;
      }


      .broadcast-section .section-title {

        display: block;
      }


      .broadcast-section .section-title h2 {

        margin-bottom: 6px;
      }


      .broadcast-section .section-title p {

        margin-bottom: 14px;
      }


      .broadcast-section .section-title > a {

        display: inline-flex;
      }


      /* =================================================
         IMPORTANT:
         TABLE BECOMES MOBILE EVENT CARDS
      ================================================= */

      .table-wrap {

        overflow: visible;

        margin-top: 18px;
      }


      .table {

        display: block;

        width: 100%;

        min-width: 0;
      }


      .table thead {

        display: none;
      }


      .table tbody {

        display: grid;

        width: 100%;

        gap: 14px;
      }


      .table tbody tr {

        display: block;

        width: 100%;

        padding: 18px;

        border:

          1px solid

          rgba(
            124,
            58,
            237,
            .15
          );

        border-radius: 18px;

        background: #ffffff;

        box-shadow:

          0

          8px

          26px

          rgba(
            31,
            20,
            48,
            .06
          );

        overflow: hidden;
      }


      .table tbody td {

        display: block;

        width: 100% !important;

        min-width: 0 !important;

        max-width: 100%;

        padding:

          9px

          0;

        border: 0 !important;

        overflow-wrap: anywhere;

        word-break: normal;

        white-space: normal !important;
      }


      /* ---------------------------------------------
         EVENT TITLE
      --------------------------------------------- */

      .table tbody td:nth-child(1) {

        padding-top: 0;

        padding-bottom: 14px;

        font-size: 19px;

        line-height: 1.35;

        font-weight: 800;

        color: #21172d;

        border-bottom:

          1px solid

          #ece8f1 !important;
      }


      /*
        Hide Event: label because title itself
        should be dominant.
      */

      .table tbody td:nth-child(1)::before {

        display: block;

        content: "EVENT";

        margin-bottom: 6px;

        color: #7C3AED;

        font-size: 11px;

        font-weight: 800;

        letter-spacing: .12em;
      }


      /* ---------------------------------------------
         STATUS
      --------------------------------------------- */

      .table tbody td:nth-child(2)::before {

        content: "Status";

        display: block;

        margin-bottom: 4px;

        color: #777080;

        font-size: 12px;

        font-weight: 600;

        text-transform: uppercase;

        letter-spacing: .05em;
      }


      /* ---------------------------------------------
         SCHEDULE
      --------------------------------------------- */

      .table tbody td:nth-child(3)::before {

        content: "Scheduled";

        display: block;

        margin-bottom: 4px;

        color: #777080;

        font-size: 12px;

        font-weight: 600;

        text-transform: uppercase;

        letter-spacing: .05em;
      }


      /* ---------------------------------------------
         ACTIONS
      --------------------------------------------- */

      .table tbody td:nth-child(4) {

        display: flex;

        flex-wrap: wrap;

        align-items: center;

        gap: 8px;

        padding-top: 14px;

        padding-bottom: 0;

        margin-top: 4px;

        border-top:

          1px solid

          #ece8f1 !important;
      }


      .table tbody td:nth-child(4)::before {

        content: "Actions";

        display: block;

        flex-basis: 100%;

        margin-bottom: 2px;

        color: #777080;

        font-size: 12px;

        font-weight: 600;

        text-transform: uppercase;

        letter-spacing: .05em;
      }


      #events-body td:nth-child(4) .btn,
      #events-body td:nth-child(4) a,
      #events-body td:nth-child(4) button {

        width: auto !important;

        max-width: 100%;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        flex:

          1

          1

          125px;

        min-height: 44px;

        margin: 0 !important;

        padding:

          10px

          14px;

        text-align: center;

        white-space: normal !important;

        line-height: 1.2;
      }


    }



    /* =====================================================
       VERY SMALL PHONES
    ====================================================== */

    @media (max-width: 430px) {


      .dashboard-actions {

        grid-template-columns: 1fr;
      }


      .dashboard-actions #logout {

        grid-column: auto;
      }


      #events-body td:nth-child(4) .btn,
      #events-body td:nth-child(4) a,
      #events-body td:nth-child(4) button {

        flex:

          1

          1

          100%;

        width: 100% !important;
      }


    }

  </style>

</head>


<body>


  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <div class="top-strip">

    🎥 Kamwenge Live™ Broadcaster Dashboard

  </div>



  <!-- =====================================================
       DASHBOARD
  ====================================================== -->

  <main class="container dashboard-main">



    <!-- ===================================================
         ACCOUNT / ACTIONS
    ==================================================== -->

    <section class="dash-head">


      <div class="host-row">


        <img
          id="dash-photo"
          class="host-avatar big-avatar"
          src="assets/images/avatar-placeholder.svg"
          alt="Broadcaster profile"
        >


        <div>

          <span class="muted">
            Signed in as
          </span>


          <h1 id="dash-name">
            Broadcaster
          </h1>

        </div>


      </div>



      <div class="dashboard-actions">


        <a
          class="btn btn-primary"
          href="create.html"
        >
          ➕ Create Meeting
        </a>


        <a
          class="btn btn-light"
          href="profile.html"
        >
          👤 Profile
        </a>


        <button
          class="btn btn-light"
          id="logout"
          type="button"
        >
          🚪 Sign Out
        </button>


      </div>


    </section>



    <!-- ===================================================
         STATISTICS
    ==================================================== -->

    <section class="stats">


      <div class="stat">

        <div class="label">
          My Events
        </div>

        <div
          id="stat-total"
          class="value"
        >
          0
        </div>

      </div>



      <div class="stat">

        <div class="label">
          Live Now
        </div>

        <div
          id="stat-live"
          class="value"
        >
          0
        </div>

      </div>



      <div class="stat">

        <div class="label">
          Upcoming
        </div>

        <div
          id="stat-upcoming"
          class="value"
        >
          0
        </div>

      </div>


    </section>



    <!-- ===================================================
         MY BROADCASTS
    ==================================================== -->

    <section class="admin-card broadcast-section">


      <div class="section-title">


        <div>

          <h2>
            📡 My Broadcasts
          </h2>


          <p>
            Open Studio to broadcast, or Public to see
            exactly what your viewers see.
          </p>

        </div>


        <a
          href="index.html"
          class="btn btn-light"
        >
          🏠 Public Site
        </a>


      </div>



      <!-- =================================================
           EVENTS
      ================================================== -->

      <div class="table-wrap">


        <table class="table">


          <thead>

            <tr>

              <th>
                Event
              </th>

              <th>
                Status
              </th>

              <th>
                Scheduled
              </th>

              <th>
                Actions
              </th>

            </tr>

          </thead>


          <!--
            dashboard.js continues loading the Firebase
            event rows here exactly as before.
          -->

          <tbody id="events-body"></tbody>


        </table>


      </div>


    </section>


  </main>



  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script
    type="module"
    src="js/app.js"
  ></script>


  <script
    type="module"
    src="js/dashboard.js"
  ></script>


</body>

</html>
